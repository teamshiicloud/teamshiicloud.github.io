<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Mercury Labs Studio</title>
<meta name="description" content="The page you are looking for does not exist.">
<meta name="author" content="Mercury Labs Studio">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon-192.png">

<script>

  script.async=true;
  script.src="https://www.googletagmanager.com/gtag/js?id=G-6VFPMPZKQP";
  document.head.appendChild(script);
  script.onload=function(){

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#185FA5;--blue-light:#3A82C4;--blue-glow:rgba(24,95,165,0.18);
  --teal:#5DCAA5;--teal-glow:rgba(93,202,165,0.15);
  --amber:#EF9F27;--amber-glow:rgba(239,159,39,0.2);
  --dark:#06101E;--dark2:#0C1A2E;
  --text:#E8F0FB;--muted:#7A9BC4;--border:rgba(93,202,165,0.15);
}
html{scroll-behavior:smooth}
body{background:var(--dark);font-family:'DM Sans',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}

/* BG effects */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;background:radial-gradient(2px 2px at 20px 30px,#eee,rgba(238,238,238,0.2) 0.5px,transparent 0.5px),radial-gradient(2px 2px at 60px 70px,#fff,rgba(255,255,255,0.3) 1px,transparent 1px),radial-gradient(1px 1px at 50px 50px,#ddd,rgba(221,221,221,0.2) 0.5px,transparent 0.5px),radial-gradient(1px 1px at 130px 80px,#fff,rgba(255,255,255,0.3) 0.5px,transparent 0.5px);background-repeat:repeat;background-size:200px 200px;opacity:0.5}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0);will-change:transform,filter}
.orb1{width:500px;height:500px;background:var(--blue-glow);top:-100px;right:-100px;animation:drift 12s ease-in-out infinite alternate}
.orb2{width:400px;height:400px;background:var(--teal-glow);bottom:0;left:-100px;animation:drift 14s ease-in-out infinite alternate-reverse}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(30px,20px)}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(6,16,30,0.80);backdrop-filter:blur(20px);border-bottom:0.5px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:36px;height:36px;object-fit:contain;flex-shrink:0}
.logo-name{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:var(--text);white-space:nowrap}
.logo-name em{color:var(--teal);font-style:normal}
.nav-back{font-size:13px;font-weight:400;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:7px;border:0.5px solid rgba(255,255,255,0.1);transition:color 0.2s,background 0.2s,border-color 0.2s;display:flex;align-items:center;gap:6px}
.nav-back:hover{color:var(--text);background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.2)}

/* MAIN CONTENT */
.content{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 24px;text-align:center;min-height:calc(100vh - 70px)}

.error-code{font-family:'Sora',sans-serif;font-size:clamp(80px, 12vw, 160px);font-weight:800;letter-spacing:-4px;line-height:1;margin-bottom:16px;background:linear-gradient(90deg,var(--blue-light),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.error-title{font-family:'Sora',sans-serif;font-size:clamp(24px, 4vw, 36px);font-weight:700;margin-bottom:24px;color:var(--text)}
.error-msg{font-size:16px;line-height:1.7;color:var(--muted);max-width:500px;margin:0 auto 40px}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:12px;background:linear-gradient(90deg,var(--blue-light),var(--teal));color:var(--dark);text-decoration:none;font-weight:700;font-size:15px;transition:all 0.3s;box-shadow:0 10px 20px -10px rgba(93,202,165,0.5)}
.btn:hover{transform:translateY(-2px);box-shadow:0 15px 25px -10px rgba(93,202,165,0.6)}

/* FOOTER */
footer{position:relative;z-index:1;text-align:center;padding:24px;border-top:0.5px solid var(--border);font-size:12px;color:var(--muted);margin-top:auto}
footer strong{color:var(--text)}

/* RESPONSIVE */
@media(max-width:720px){
  .logo-name{font-size:13px}
  nav{
    padding:12px 16px;
    background:rgba(6, 16, 30, 0.92);
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .orb {
    animation:none !important;
    filter:blur(50px);
  }
  .orb1{width:300px;height:300px}
  .orb2{width:250px;height:250px}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- NAV -->
<nav>
  <a class="logo" href="/">
    <img class="logo-mark" src="logo-mark.webp" alt="Mercury Labs Studio Logo">
    <span class="logo-name">Mercury<em>Labs</em> Studio</span>
  </a>
</nav>

<!-- CONTENT -->
<main class="content">
  <div class="error-code">404</div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-msg">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
  <a href="/" class="btn">Return to Home</a>
</main>

<footer>© 2025–<span id="yr"></span> <strong>Mercury Labs Studio</strong> · Crafted with passion in Vietnam 🇻🇳</footer>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
</script>
</body>
</html>
